# Runs on every pull request into dev, so a broken change is caught before the
# merge that would deploy it. Same checks and build as the deploy job.
name: Check

on:
  pull_request:
    branches: [dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'features/**', 'server/**', 'shared/**', 'ui/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run check:compiler
      - run: npm test
      - run: npm run build
