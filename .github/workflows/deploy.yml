# Every push to dev (a merged PR) is checked, built once here, and shipped to
# the EC2 server as a compressed standalone bundle. The server only unpacks and
# restarts. SSH is opened for this runner's IP only while the deploy runs.
name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'features/**', 'server/**', 'shared/**', 'ui/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm ci --no-audit --no-fund

      # next build also type-checks, so only the checks it does not cover run here.
      - run: npm run check:compiler
      - run: npm test

      - name: Build standalone bundle
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/
          tar -czf bundle.tgz -C .next/standalone .
          ls -lh bundle.tgz

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Open SSH for this runner
        id: ip
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "${{ vars.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions}]"

      - name: Ship and restart
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ vars.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          HOST="ec2-user@${{ vars.EC2_HOST }}"
          scp -i ~/.ssh/deploy scripts/deploy-server.sh "$HOST:/tmp/deploy-server.sh"
          ssh -i ~/.ssh/deploy "$HOST" 'bash /tmp/deploy-server.sh' < bundle.tgz

      - name: Close SSH again
        if: always() && steps.ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ vars.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.ip }}/32}]"
